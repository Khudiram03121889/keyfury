<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeyFury 3D - 4 Dynamic Combat Arenas & Martial Arts Fighters</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050814;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e2e8f0;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* Cyberpunk HUD Overlay */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 28px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }
    .brand-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #00f0ff;
      text-shadow: 0 0 16px rgba(0, 240, 255, 0.7);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(236, 72, 153, 0.2);
      border: 1px solid #ec4899;
      color: #f472b6;
      letter-spacing: 1.5px;
      transition: all 0.3s ease;
    }
    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      letter-spacing: 2px;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .hud-status {
      display: flex;
      gap: 16px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 11px;
    }
    .status-item {
      display: flex;
      flex-direction: column;
    }
    .status-label {
      color: #64748b;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .status-value {
      font-weight: 700;
      color: #f1f5f9;
    }
    .status-value.cyan { color: #38bdf8; }
    .status-value.crimson { color: #f87171; }
    .status-value.emerald { color: #34d399; }
    .status-value.amber { color: #fbbf24; }
    .status-value.amethyst { color: #c084fc; }

    /* Controls Panel */
    .controls-panel {
      pointer-events: auto;
      align-self: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(15, 23, 42, 0.90);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      max-width: 95vw;
    }
    .toolbar-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .toolbar-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      margin-right: 4px;
    }
    .btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }
    .btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
    }
    .btn-arena {
      border-width: 1.5px;
    }
    .btn-arena.active {
      border-color: #00f0ff;
      background: linear-gradient(135deg, #0369a1, #0284c7);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.7);
    }
    /* Loading overlay */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #050814;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 240, 255, 0.2);
      border-top-color: #00f0ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 13px;
      letter-spacing: 3px;
      color: #00f0ff;
      text-transform: uppercase;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-msg">Initializing KeyFury 3D Arenas & Martial Arts Roster...</div>
  </div>

  <div id="canvas-container"></div>

  <div class="hud-layer">
    <div class="header">
      <div>
        <div class="brand-title">
          KeyFury 3D
          <span class="brand-badge" id="hud-badge">HIGHLAND SANCTUARY</span>
        </div>
        <div class="subtitle" id="hud-subtitle">SACRED MOUNTAIN SHRINE // GOLDEN HOUR ZENITH</div>
      </div>
      <div class="hud-status">
        <div class="status-item">
          <span class="status-label">Active Map</span>
          <span class="status-value cyan" id="status-arena">Highland Sanctuary</span>
        </div>
        <div class="status-item">
          <span class="status-label">Platform Ratio</span>
          <span class="status-value emerald" id="status-ratio">0.72 (28% H)</span>
        </div>
        <div class="status-item">
          <span class="status-label">Lighting Mood</span>
          <span class="status-value amber" id="status-lighting">Alpine Daylight</span>
        </div>
        <div class="status-item">
          <span class="status-label">Engine</span>
          <span class="status-value">Three.js WebGL</span>
        </div>
      </div>
    </div>

    <div class="controls-panel">
      <!-- Row 1: Arena Selector -->
      <div class="toolbar-row">
        <span class="toolbar-label">Combat Arena:</span>
        <button class="btn btn-arena active" data-arena="highland_sanctuary" onclick="switchArena('highland_sanctuary')">
          <span>Highland Sanctuary</span>
        </button>
        <button class="btn btn-arena" data-arena="cyber_rooftop" onclick="switchArena('cyber_rooftop')">
          <span>Cyber Neon Rooftop</span>
        </button>
        <button class="btn btn-arena" data-arena="volcanic_caldera" onclick="switchArena('volcanic_caldera')">
          <span>Volcanic Caldera</span>
        </button>
        <button class="btn btn-arena" data-arena="celestial_void" onclick="switchArena('celestial_void')">
          <span>Celestial Void Shrine</span>
        </button>
      </div>

      <!-- Row 2: Camera Angles & Fighters -->
      <div class="toolbar-row">
        <span class="toolbar-label">Camera Angle:</span>
        <button class="btn active" data-mode="combat" onclick="setCamera('combat')">Fight Cam</button>
        <button class="btn" data-mode="side" onclick="setCamera('side')">Side Duel</button>
        <button class="btn" data-mode="aerial" onclick="setCamera('aerial')">Arena Drone</button>
        <button class="btn" data-mode="ronin" onclick="setCamera('ronin')">Ronin</button>
        <button class="btn" data-mode="valkFront" onclick="setCamera('valkFront')">Valkyrie</button>
        <button class="btn" data-mode="shinobi" onclick="setCamera('shinobi')">Shinobi</button>
        <button class="btn" data-mode="void" onclick="setCamera('void')">Void Assassin</button>
        <button class="btn" id="btn-anim" onclick="toggleAnimation()">Pause Motion</button>
        <button class="btn" id="btn-rotate" onclick="toggleAutoRotate()">Auto-Rotate</button>
      </div>
    </div>
  </div>

  <!-- Three.js + GLTFLoader + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const ARENAS = {
      highland_sanctuary: {
        id: "highland_sanctuary",
        name: "Highland Sanctuary",
        subtitle: "Sacred Mountain Shrine // Golden Hour Zenith",
        glb: "./KeyFury_3D_HighlandSanctuary.glb",
        platformRatio: 0.72,
        camY: 2.835,
        lightingMood: "Alpine Daylight",
        ambientColor: 0x99ccff,
        ambientIntensity: 0.9,
        keyColor: 0xfff8e7,
        keyIntensity: 1.4,
        keyPos: [-6, 12, 10],
        rimColor: 0xffeedd,
        rimIntensity: 1.2,
        rimPos: [6, 10, -6],
        badgeColor: "rgba(34, 197, 94, 0.2)",
        badgeBorder: "#22c55e",
        badgeText: "#4ade80"
      },
      cyber_rooftop: {
        id: "cyber_rooftop",
        name: "Cyber Neon Rooftop",
        subtitle: "Neo-Kyoto Skyway // High Voltage Midnight",
        glb: "./KeyFury_3D_CyberRooftop.glb",
        platformRatio: 0.73,
        camY: 2.73375,
        lightingMood: "Neon Night",
        ambientColor: 0x0a1424,
        ambientIntensity: 0.85,
        keyColor: 0x00e5ff,
        keyIntensity: 1.3,
        keyPos: [-6, 8, 8],
        rimColor: 0xff0066,
        rimIntensity: 1.4,
        rimPos: [6, 8, -6],
        badgeColor: "rgba(236, 72, 153, 0.2)",
        badgeBorder: "#ec4899",
        badgeText: "#f472b6"
      },
      volcanic_caldera: {
        id: "volcanic_caldera",
        name: "Volcanic Caldera",
        subtitle: "Molten Magma Crucible // Obsidian Bastion",
        glb: "./KeyFury_3D_VolcanicCaldera.glb",
        platformRatio: 0.62,
        camY: 3.8475,
        lightingMood: "Infernal Blaze",
        ambientColor: 0x2a0800,
        ambientIntensity: 1.1,
        keyColor: 0xff6600,
        keyIntensity: 1.6,
        keyPos: [-6, 9, 8],
        rimColor: 0xff2200,
        rimIntensity: 1.5,
        rimPos: [6, 6, -6],
        badgeColor: "rgba(239, 68, 68, 0.2)",
        badgeBorder: "#ef4444",
        badgeText: "#f87171"
      },
      celestial_void: {
        id: "celestial_void",
        name: "Celestial Void Shrine",
        subtitle: "Astral Nebula Rift // Dimensional Altar",
        glb: "./KeyFury_3D_CelestialVoid.glb",
        platformRatio: 0.71,
        camY: 2.93625,
        lightingMood: "Astral Nebula",
        ambientColor: 0x150b28,
        ambientIntensity: 0.95,
        keyColor: 0xa855f7,
        keyIntensity: 1.4,
        keyPos: [-6, 8, 8],
        rimColor: 0x38bdf8,
        rimIntensity: 1.3,
        rimPos: [6, 8, -6],
        badgeColor: "rgba(168, 85, 247, 0.2)",
        badgeBorder: "#a855f7",
        badgeText: "#c084fc"
      }
    };

    let scene, camera, renderer, controls;
    let mixer, clock;
    let isAnimating = true;
    let currentArenaId = 'highland_sanctuary';
    let currentArenaModel = null;
    let fightersModel = null;
    let arenaCache = {};
    let currentCamMode = 'combat';

    let ambLight, keyLight, rimLight, fillLight;

    const cameraTargets = {
      combat: { pos: [0, 2.835, 8.8], lookAt: [0, 1.0, 0.1] },
      void: { pos: [0.88, 1.10, 4.58], lookAt: [0.88, 0.95, 0.38] },
      shinobi: { pos: [-0.88, 1.10, 4.58], lookAt: [-0.88, 0.95, 0.38] },
      ronin: { pos: [-2.55, 1.10, 4.00], lookAt: [-2.55, 0.95, -0.20] },
      valkFront: { pos: [2.55, 1.10, 4.20], lookAt: [2.55, 0.95, 0.20] },
      side: { pos: [9.0, 2.2, 0.1], lookAt: [0, 1.0, 0.1] },
      aerial: { pos: [0, 12.0, 9.0], lookAt: [0, 0.5, 0] }
    };

    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();

      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050814);
      scene.fog = new THREE.FogExp2(0x050814, 0.015);

      // Camera (calibrated 40mm focal length)
      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2.835, 8.8);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      // Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 1.0, 0.1);
      controls.maxPolarAngle = Math.PI / 2 + 0.05;

      // Studio Lighting
      ambLight = new THREE.AmbientLight(0x99ccff, 0.9);
      scene.add(ambLight);

      keyLight = new THREE.DirectionalLight(0xfff8e7, 1.4);
      keyLight.position.set(-6, 12, 10);
      scene.add(keyLight);

      rimLight = new THREE.DirectionalLight(0xffeedd, 1.2);
      rimLight.position.set(6, 10, -6);
      scene.add(rimLight);

      fillLight = new THREE.DirectionalLight(0xddeeff, 0.5);
      fillLight.position.set(0, 4, 10);
      scene.add(fillLight);

      // Fighter spot keys
      const valkKey = new THREE.DirectionalLight(0xfff5ee, 0.8);
      valkKey.position.set(2.55, 3.5, 6);
      scene.add(valkKey);

      const roninKey = new THREE.DirectionalLight(0xfff5ee, 0.8);
      roninKey.position.set(-2.55, 3.5, 6);
      scene.add(roninKey);

      // 1. Load Fighters Roster
      const loader = new THREE.GLTFLoader();
      document.getElementById('loading-msg').innerText = "Loading KeyFury Martial Arts Roster...";

      loader.load('./KeyFury_3D_Arena.glb', function(gltf) {
        fightersModel = gltf.scene;

        // Hide old rooftop meshes so only the 4 martial artists remain active
        fightersModel.traverse(node => {
          if (node.name.includes("Arena_") || node.name.includes("Combat_HUD")) {
            node.visible = false;
          }
          if (node.isMesh && node.material) {
            node.material.depthWrite = true;
            if (node.name.includes("Cyber_Valkyrie") || node.name.includes("Shadow_Ronin") || node.name.includes("Volt_Shinobi") || node.name.includes("Void_Assassin")) {
              node.material.transparent = false;
            }
          }
        });

        scene.add(fightersModel);

        if (gltf.animations && gltf.animations.length) {
          mixer = new THREE.AnimationMixer(fightersModel);
          gltf.animations.forEach(clip => {
            const action = mixer.clipAction(clip);
            action.play();
          });
        }

        // 2. Load Initial Arena (Highland Sanctuary)
        switchArena('highland_sanctuary', true);

      }, undefined, function(err) {
        console.warn('Fighters roster direct load warning:', err);
        // Load arena anyway
        switchArena('highland_sanctuary', true);
      });

      window.addEventListener('resize', onWindowResize, false);
      animate();
    }

    function switchArena(arenaId, isFirstLoad = false) {
      const cfg = ARENAS[arenaId];
      if (!cfg) return;

      currentArenaId = arenaId;

      // Update Toolbar Buttons
      document.querySelectorAll('.btn-arena').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-arena') === arenaId);
      });

      // Update HUD
      document.getElementById('hud-badge').innerText = cfg.name.toUpperCase();
      document.getElementById('hud-badge').style.background = cfg.badgeColor;
      document.getElementById('hud-badge').style.borderColor = cfg.badgeBorder;
      document.getElementById('hud-badge').style.color = cfg.badgeText;
      document.getElementById('hud-subtitle').innerText = cfg.subtitle;

      document.getElementById('status-arena').innerText = cfg.name;
      document.getElementById('status-ratio').innerText = `${cfg.platformRatio} (${Math.round((1 - cfg.platformRatio) * 100)}% H)`;
      document.getElementById('status-lighting').innerText = cfg.lightingMood;

      // Update Lighting
      ambLight.color.setHex(cfg.ambientColor);
      ambLight.intensity = cfg.ambientIntensity;

      keyLight.color.setHex(cfg.keyColor);
      keyLight.intensity = cfg.keyIntensity;
      keyLight.position.set(cfg.keyPos[0], cfg.keyPos[1], cfg.keyPos[2]);

      rimLight.color.setHex(cfg.rimColor);
      rimLight.intensity = cfg.rimIntensity;
      rimLight.position.set(cfg.rimPos[0], cfg.rimPos[1], cfg.rimPos[2]);

      // Update Camera Targets for Fight Cam
      cameraTargets.combat.pos[1] = cfg.camY;
      if (currentCamMode === 'combat') {
        controls.target.set(cameraTargets.combat.lookAt[0], cameraTargets.combat.lookAt[1], cameraTargets.combat.lookAt[2]);
        camera.position.set(cameraTargets.combat.pos[0], cameraTargets.combat.pos[1], cameraTargets.combat.pos[2]);
        controls.update();
      }

      // Hot-swap Arena 3D Model
      if (arenaCache[arenaId]) {
        if (currentArenaModel) scene.remove(currentArenaModel);
        currentArenaModel = arenaCache[arenaId];
        scene.add(currentArenaModel);
        hideOverlay();
      } else {
        const overlay = document.getElementById('loading-overlay');
        overlay.style.display = 'flex';
        overlay.style.opacity = '1';
        document.getElementById('loading-msg').innerText = `Loading 3D Arena: ${cfg.name}...`;

        const loader = new THREE.GLTFLoader();
        loader.load(cfg.glb, function(gltf) {
          if (currentArenaModel) scene.remove(currentArenaModel);

          const model = gltf.scene;
          model.traverse(node => {
            if (node.isMesh && node.material) {
              node.material.depthWrite = true;
            }
          });

          arenaCache[arenaId] = model;
          currentArenaModel = model;
          scene.add(model);

          hideOverlay();
          console.log(`Arena ${cfg.name} successfully loaded into 3D scene!`);
        }, undefined, function(err) {
          console.error(`Error loading arena ${cfg.name}:`, err);
          hideOverlay();
        });
      }
    }

    function hideOverlay() {
      const overlay = document.getElementById('loading-overlay');
      overlay.style.opacity = '0';
      setTimeout(() => overlay.style.display = 'none', 400);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function setCamera(mode) {
      currentCamMode = mode;
      document.querySelectorAll('.controls-panel .btn').forEach(b => {
        if (b.getAttribute('data-mode') === mode) b.classList.add('active');
        else if (b.getAttribute('data-mode')) b.classList.remove('active');
      });

      const cfg = cameraTargets[mode];
      if (!cfg) return;

      controls.target.set(cfg.lookAt[0], cfg.lookAt[1], cfg.lookAt[2]);
      camera.position.set(cfg.pos[0], cfg.pos[1], cfg.pos[2]);
      camera.lookAt(controls.target);
      controls.update();
    }

    function toggleAnimation() {
      isAnimating = !isAnimating;
      const btn = document.getElementById('btn-anim');
      btn.innerText = isAnimating ? "Pause Motion" : "Resume Motion";
      btn.classList.toggle('active', !isAnimating);
    }

    function toggleAutoRotate() {
      controls.autoRotate = !controls.autoRotate;
      controls.autoRotateSpeed = 2.0;
      const btn = document.getElementById('btn-rotate');
      btn.classList.toggle('active', controls.autoRotate);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer && isAnimating) {
        mixer.update(delta);
      }
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
