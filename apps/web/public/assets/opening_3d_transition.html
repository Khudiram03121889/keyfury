<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KeyFury - 3D Logo & Title Opening Motion Graphic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #060913;
      font-family: 'Outfit', sans-serif;
      color: #f8fafc;
      user-select: none;
    }
    .comp-root {
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, #0d1527 0%, #060913 80%);
      overflow: hidden;
      perspective: 1200px;
    }

    /* Ambient Background Grids & Hologram Glows */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
      background-size: 64px 64px;
      z-index: 1;
    }
    .bg-glow-cyan {
      position: absolute;
      width: 80vw;
      height: 80vw;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, rgba(6, 9, 19, 0) 70%);
      z-index: 2;
      pointer-events: none;
    }
    .bg-glow-purple {
      position: absolute;
      width: 60vw;
      height: 60vw;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(168, 85, 247, 0.18) 0%, rgba(6, 9, 19, 0) 70%);
      z-index: 2;
      pointer-events: none;
    }

    /* 3D Perspective Card Container */
    .transition-stage {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transform-style: preserve-3d;
    }

    .hero-card-3d {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(30px, 4vw, 50px) clamp(40px, 6vw, 90px);
      border-radius: 36px;
      background: linear-gradient(135deg, rgba(10, 15, 29, 0.90) 0%, rgba(18, 24, 40, 0.82) 100%);
      border: 2px solid rgba(56, 189, 248, 0.5);
      box-shadow: 
        0 0 80px rgba(56, 189, 248, 0.25),
        0 30px 60px rgba(0, 0, 0, 0.8),
        inset 0 0 30px rgba(56, 189, 248, 0.15);
      backdrop-filter: blur(24px);
      transform-style: preserve-3d;
      will-change: transform, opacity;
      max-width: 90vw;
    }

    /* Holographic Logo Badge */
    .logo-container {
      position: relative;
      width: clamp(90px, 12vw, 150px);
      height: clamp(90px, 12vw, 150px);
      margin-bottom: 24px;
      transform: translateZ(50px);
    }
    .logo-aura {
      position: absolute;
      inset: -12px;
      border-radius: 38px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.6) 0%, transparent 70%);
      filter: blur(14px);
    }
    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 28px;
      object-fit: cover;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.7);
    }

    /* Titles */
    .title-group {
      text-align: center;
      transform: translateZ(70px);
    }
    .title-main {
      font-size: clamp(2.5rem, 6vw, 5.5rem);
      font-weight: 900;
      letter-spacing: 6px;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 40px rgba(56, 189, 248, 0.8), 0 0 80px rgba(56, 189, 248, 0.35);
      text-transform: uppercase;
    }
    .title-main span {
      color: #38bdf8;
    }
    .title-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.85rem, 1.8vw, 1.5rem);
      font-weight: 800;
      letter-spacing: 5px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 12px;
    }

    /* Badge */
    .combat-badge {
      transform: translateZ(40px);
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 24px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1.5px solid rgba(56, 189, 248, 0.5);
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.75rem, 1.2vw, 1rem);
      font-weight: 700;
      letter-spacing: 2px;
      color: #38bdf8;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    /* Cross-fade Light Sweep Lens Flare */
    .lens-flare {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.5) 0%, transparent 65%);
      pointer-events: none;
      z-index: 20;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="comp-root" data-duration="2.5">
    <div class="bg-grid"></div>
    <div class="bg-glow-cyan"></div>
    <div class="bg-glow-purple"></div>
    <div class="lens-flare" id="lensFlare"></div>

    <div class="transition-stage">
      <div class="hero-card-3d" id="heroCard">
        <div class="logo-container">
          <div class="logo-aura"></div>
          <img class="logo-img" src="/logo.jpg" alt="KeyFury Logo">
        </div>
        <div class="title-group">
          <div class="title-main">KEY<span>FURY</span></div>
          <div class="title-sub">KEYBOARD STICKMAN WARRIOR</div>
        </div>
        <div class="combat-badge">
          <span>⚡ 1V1 COMPETITIVE TYPING COMBAT ⚡</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // HyperFrames deterministic seekable timeline
    const tl = gsap.timeline({ paused: false, repeat: -1, repeatDelay: 0.5 });

    // Act 1: 3D Entrance Zoom & Tilt (0.0s -> 0.6s)
    tl.fromTo("#heroCard", 
      {
        opacity: 0,
        scale: 0.82,
        rotationX: 18,
        rotationY: -10,
        z: -120,
      },
      {
        opacity: 1,
        scale: 1.0,
        rotationX: 0,
        rotationY: 0,
        z: 0,
        duration: 0.65,
        ease: "power3.out"
      },
      0
    );

    // Subtle 3D Floating Breath (0.6s -> 1.5s)
    tl.to("#heroCard", {
      rotationX: 3,
      rotationY: 4,
      z: 25,
      duration: 0.85,
      ease: "sine.inOut"
    }, 0.65);

    // Cross-fade lens flare flash right before handoff (1.4s -> 1.7s)
    tl.fromTo("#lensFlare",
      { opacity: 0, scale: 0.7 },
      { opacity: 0.6, scale: 1.2, duration: 0.25, ease: "power2.out" },
      1.4
    );
    tl.to("#lensFlare",
      { opacity: 0, duration: 0.35, ease: "power2.in" },
      1.65
    );

    // 3D Depth Dissolution into Character Entrance (1.5s -> 2.0s)
    tl.to("#heroCard", {
      opacity: 0,
      scale: 1.12,
      rotationX: -10,
      z: 80,
      duration: 0.5,
      ease: "power3.in"
    }, 1.5);

    // Expose HyperFrames seek handle
    window.__hfSeek = (time) => {
      tl.seek(time);
    };
  </script>
</body>
</html>
